# Requer metrics-server no cluster (padrão em GKE/EKS/AKS gerenciados) para que o
# HPA consiga ler utilização de CPU dos pods.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vendas-api-hpa
  namespace: gamestore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vendas-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
