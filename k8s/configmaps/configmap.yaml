# Configuração não sensível dos 3 microsserviços, da Function serverless e da infra
# de suporte (Postgres, RabbitMQ, Elasticsearch, Jaeger) — migrada 1:1 das variáveis
# de ambiente de docker-compose.yml. Consumida via `envFrom.configMapRef` nos
# Deployments em k8s/deployments/, então as chaves reproduzem exatamente os nomes
# de configuração que o .NET espera (seções separadas por "__").
apiVersion: v1
kind: ConfigMap
metadata:
  name: gamestore-config
  namespace: gamestore
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORT: "80"

  # PostgreSQL (imagem oficial postgres:16-alpine)
  POSTGRES_DB: "GameStore"
  PGDATA: "/var/lib/postgresql/data/pgdata"

  Jwt__Issuer: "TheThroneOfGames"
  Jwt__Audience: "TheThroneOfGamesClient"

  EventBus__UseRabbitMq: "true"
  EventBus__RabbitMq__HostName: "rabbitmq"
  EventBus__RabbitMq__Port: "5672"

  Elasticsearch__Uri: "http://elasticsearch:9200"

  # Distributed Tracing — todos os serviços (3 APIs + Function) exportam para o
  # Jaeger do cluster via OTLP gRPC (T07).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"

  FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"

  # Elasticsearch (single-node, sem segurança — mesmo perfil usado em desenvolvimento
  # em docker-compose.yml; ver k8s/deployments/elasticsearch-deployment.yaml)
  ES_JAVA_OPTS: "-Xms512m -Xmx512m"
  discovery.type: "single-node"
  xpack.security.enabled: "false"

  # Jaeger — armazena traces no Elasticsearch do cluster (mesmo backend usado
  # pela busca do Catálogo, evita subir um segundo motor de storage só para traces).
  COLLECTOR_OTLP_ENABLED: "true"
  SPAN_STORAGE_TYPE: "elasticsearch"
  ES_SERVER_URLS: "http://elasticsearch:9200"

  # Grafana (monitoramento — requisito funcional do edital FIAP)
  GF_INSTALL_PLUGINS: "grafana-piechart-panel"
