# Espelha monitoring/prometheus.yml (fonte da verdade, usada em docker-compose.yml) — mesmos
# alvos e portas dedicadas de métricas (KestrelMetricServer em Program.cs de cada API),
# apenas resolvendo pelos nomes de Service do cluster em vez dos container_name do compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gamestore
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'gamestore-k8s-monitor'

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'usuarios-api'
        static_configs:
          - targets: ['usuarios-api:9091']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'catalogo-api'
        static_configs:
          - targets: ['catalogo-api:9092']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'vendas-api'
        static_configs:
          - targets: ['vendas-api:9093']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'partidas-api'
        static_configs:
          - targets: ['partidas-api:9094']
        metrics_path: '/metrics'
        scrape_interval: 5s

      # kube-state-metrics — só existe no cluster Kubernetes (não em docker-compose, que não
      # tem API server pra observar). Alimenta o painel "Pods por Deployment" do Grafana com
      # a contagem real de réplicas de cada HPA, ver k8s/deployments/kube-state-metrics-deployment.yaml.
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']
        metrics_path: '/metrics'
        scrape_interval: 10s
