# ClusterIP — o único caminho de entrada externo é o Ingress (k8s/ingress/ingress.yaml),
# nunca este Service diretamente.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: gamestore
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
