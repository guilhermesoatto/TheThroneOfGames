# Jaeger — backend de APM/Distributed Tracing (T07). Recebe spans via OTLP (gRPC/HTTP)
# dos 3 microsserviços e da Function, e persiste no Elasticsearch do cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: gamestore
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          envFrom:
            - configMapRef:
                name: gamestore-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 20
            periodSeconds: 20
