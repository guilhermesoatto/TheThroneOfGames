# GameStore.Usuarios.API — bounded context de Usuários (login, cadastro, perfil).
# Imagem construída a partir de GameStore.Usuarios.API/Dockerfile (Alpine, non-root,
# ver T02); publicar no registry do provedor de nuvem escolhido antes do deploy real
# (ex.: docker build -t <registry>/usuarios-api:1.0.0 -f GameStore.Usuarios.API/Dockerfile . && docker push ...)
# e ajustar `image:` abaixo — não há pipeline de CI/CD de publish neste repositório.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-api
  namespace: gamestore
  labels:
    app: usuarios-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: usuarios-api
  template:
    metadata:
      labels:
        app: usuarios-api
    spec:
      containers:
        - name: usuarios-api
          image: gamestore/usuarios-api:latest
          imagePullPolicy: IfNotPresent
          # A imagem roda como appuser (non-root, ver Dockerfile) mas o Kestrel está fixado em
          # Program.cs para escutar na porta 80 — no Linux, processos non-root não podem fazer
          # bind em portas <1024 sem essa capability. NET_BIND_SERVICE concede exatamente (e
          # apenas) esse privilégio, sem reintroduzir root nem exigir mudança de porta/código.
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          ports:
            - containerPort: 80
            # Servidor Kestrel dedicado do prometheus-net (KestrelMetricServer, Program.cs) —
            # /metrics também respondido em :80, mas mantemos a porta dedicada para paridade com
            # docker-compose.yml e o scrape config em monitoring/prometheus.yml.
            - containerPort: 9091
              name: metrics
          envFrom:
            - configMapRef:
                name: gamestore-config
            - secretRef:
                name: gamestore-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # httpGet nativo do Kubernetes — dispensa curl dentro da imagem (T02+T04).
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
