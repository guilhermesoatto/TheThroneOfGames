# kube-state-metrics — expõe o estado dos objetos da API do Kubernetes (contagem de réplicas
# por Deployment, status de Pods, etc.) como métricas Prometheus. Sem isso, o Prometheus só
# enxerga métricas de aplicação (via /metrics de cada API) — não tem como saber quantos pods
# um Deployment tem "agora", que é exatamente o que o HPA escalando precisa para aparecer no
# Grafana (fora do escopo do PRD original da Fase 4; adicionado para o relatório de custo/
# capacidade — ver docs/Objectives/... e o artifact de custo).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: gamestore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: gamestore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: gamestore
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          ports:
            - containerPort: 8080
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
