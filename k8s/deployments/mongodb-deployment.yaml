# MongoDB — persistência do bounded context Partidas (matchmaking), único dos 4 serviços com
# banco NoSQL (ver docs/ai/tasks/prd-partidas.json designDecisions.persistencia). Autohospedado
# (mesmo padrão de postgres-deployment.yaml) em vez de um serviço gerenciado de nuvem
# específico, pra não prender essa parte da arquitetura a um único provedor.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: gamestore
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: gamestore
  labels:
    app: mongodb
spec:
  replicas: 1
  # Evita dois pods montando o mesmo PVC ReadWriteOnce simultaneamente durante o rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Sem HTTP nativo no Mongo — tcpSocket é o probe nativo do Kubernetes para
          # protocolos não-HTTP (não depende de mongosh dentro da imagem).
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc
