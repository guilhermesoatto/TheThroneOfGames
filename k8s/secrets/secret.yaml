# Credenciais migradas 1:1 de docker-compose.yml / .env.example para Secret Kubernetes.
#
# ATENÇÃO: os valores abaixo são os mesmos placeholders de DESENVOLVIMENTO já usados
# em docker-compose.yml (senha "YourSecurePassword123!", usuário/senha "guest" do
# RabbitMQ, etc.) — NÃO são segredos reais e estão versionados de propósito para a
# entrega acadêmica (FIAP). Em um cluster de produção real, este arquivo não deveria
# ser versionado; usar um cofre externo (Sealed Secrets, External Secrets Operator,
# HashiCorp Vault ou o KMS do provedor de nuvem) para gerar o Secret em runtime.
#
# `type: Opaque` com `data` em base64 (exigido pelo schema do Kubernetes — não é
# criptografia, apenas codificação). Gerado com:
#   printf '<valor>' | base64 -w0
apiVersion: v1
kind: Secret
metadata:
  name: gamestore-secrets
  namespace: gamestore
type: Opaque
data:
  # PostgreSQL
  POSTGRES_USER: c2E=
  POSTGRES_PASSWORD: WW91clNlY3VyZVBhc3N3b3JkMTIzIQ==

  # String de conexão completa consumida pelas 3 APIs (ConnectionStrings__DefaultConnection)
  ConnectionStrings__DefaultConnection: SG9zdD1wb3N0Z3Jlc3FsLXNlcnZpY2U7UG9ydD01NDMyO0RhdGFiYXNlPUdhbWVTdG9yZTtVc2VybmFtZT1zYTtQYXNzd29yZD1Zb3VyU2VjdXJlUGFzc3dvcmQxMjMh

  # JWT
  Jwt__Key: eW91ci1zdXBlci1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMzItY2hhcmFjdGVycy1sb25nIQ==

  # RabbitMQ — credenciais do broker (usadas pelo container oficial) e as mesmas
  # credenciais consumidas pelas 3 APIs via EventBus__RabbitMq__*
  RABBITMQ_DEFAULT_USER: Z3Vlc3Q=
  RABBITMQ_DEFAULT_PASS: Z3Vlc3Q=
  EventBus__RabbitMq__UserName: Z3Vlc3Q=
  EventBus__RabbitMq__Password: Z3Vlc3Q=
  RabbitMqConnection: YW1xcDovL2d1ZXN0Omd1ZXN0QHJhYmJpdG1xOjU2NzI=

  # Grafana
  GF_SECURITY_ADMIN_USER: YWRtaW4=
  GF_SECURITY_ADMIN_PASSWORD: YWRtaW4=

  # Azurite (emulador de Azure Storage exigido pelo AzureWebJobsStorage da Function) —
  # connection string de desenvolvimento pública e bem conhecida da Microsoft, não é
  # um segredo real, mas fica no Secret por ser o mecanismo nativo de credencial da
  # Function no Azure Functions Worker.
  AzureWebJobsStorage: 
