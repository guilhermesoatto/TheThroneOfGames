services:
  # SQL Server Database (provider real usado por TheThroneOfGames.Infrastructure/Program.cs)
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: thethroneofgames-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourSecurePassword123!"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - thethroneofgames-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"YourSecurePassword123!\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # TheThroneOfGames API (Monolito - Fase 2)
  api:
    # `docker compose pull` puxa a imagem publicada pela esteira de CD (job `package` -> GHCR).
    # `docker compose up --build` reconstrói localmente a partir do Dockerfile.
    image: ghcr.io/guilhermesoatto/thethroneofgames/thethroneofgames-api:${API_TAG:-release-fase-2-monolito}
    build:
      context: .
      dockerfile: TheThroneOfGames.API/Dockerfile
    container_name: thethroneofgames-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Initial Catalog=GameStore;User ID=sa;Password=YourSecurePassword123!;Encrypt=False;TrustServerCertificate=True"
      Jwt__Key: "dev-secret-key-at-least-32-characters-long-change-in-prod"
      Jwt__Issuer: "TheThroneOfGames"
      Jwt__Audience: "TheThroneOfGamesClient"
    ports:
      - "5000:80"
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - thethroneofgames-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/api/usuario/public-info" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: thethroneofgames-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - thethroneofgames-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:10.2.0
    container_name: thethroneofgames-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - thethroneofgames-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  thethroneofgames-network:
    driver: bridge

volumes:
  mssql-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
