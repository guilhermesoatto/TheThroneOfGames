services:
  # PostgreSQL Database
  mssql:
    image: postgres:16-alpine
    container_name: thethroneofgames-db
    environment:
      POSTGRES_DB: GameStore
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: YourSecurePassword123!
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - thethroneofgames-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: thethroneofgames-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - thethroneofgames-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (nginx) — único ponto de entrada externo; roteia para os 3 microsserviços
  api-gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - usuarios-api
      - catalogo-api
      - vendas-api
    networks:
      - thethroneofgames-network

  # Elasticsearch — busca avançada de jogos no Catálogo
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - thethroneofgames-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Jaeger — backend de Distributed Tracing (fase3-T08), armazenamento no Elasticsearch
  # já usado pelo Catálogo (evita depender de um segundo motor de storage só para traces).
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: elasticsearch
      ES_SERVER_URLS: "http://elasticsearch:9200"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - thethroneofgames-network

  # Usuarios Microservice
  usuarios-api:
    build:
      context: .
      dockerfile: GameStore.Usuarios.API/Dockerfile
    container_name: usuarios-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORT: 80
      ConnectionStrings__DefaultConnection: "Host=mssql;Port=5432;Database=GameStore;Username=sa;Password=YourSecurePassword123!"
      Jwt__Key: "your-super-secret-key-that-is-at-least-32-characters-long!"
      Jwt__Issuer: "TheThroneOfGames"
      Jwt__Audience: "TheThroneOfGamesClient"
      EventBus__UseRabbitMq: "true"
      EventBus__RabbitMq__HostName: "rabbitmq"
      EventBus__RabbitMq__Port: "5672"
      EventBus__RabbitMq__UserName: "guest"
      EventBus__RabbitMq__Password: "guest"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "5001:80"
      - "9091:9091"  # Prometheus metrics
    depends_on:
      - mssql
      - rabbitmq
      - jaeger
    networks:
      - thethroneofgames-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    

  # Catalogo Microservice
  catalogo-api:
    build:
      context: .
      dockerfile: GameStore.Catalogo.API/Dockerfile
    container_name: catalogo-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORT: 80
      ConnectionStrings__DefaultConnection: "Host=mssql;Port=5432;Database=GameStore;Username=sa;Password=YourSecurePassword123!"
      Jwt__Key: "your-super-secret-key-that-is-at-least-32-characters-long!"
      Jwt__Issuer: "TheThroneOfGames"
      Jwt__Audience: "TheThroneOfGamesClient"
      EventBus__UseRabbitMq: "true"
      EventBus__RabbitMq__HostName: "rabbitmq"
      EventBus__RabbitMq__Port: "5672"
      EventBus__RabbitMq__UserName: "guest"
      EventBus__RabbitMq__Password: "guest"
      Elasticsearch__Uri: "http://elasticsearch:9200"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "5002:80"
      - "9092:9092"  # Prometheus metrics
    depends_on:
      - mssql
      - rabbitmq
      - elasticsearch
      - jaeger
    networks:
      - thethroneofgames-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vendas Microservice
  vendas-api:
    build:
      context: .
      dockerfile: GameStore.Vendas.API/Dockerfile
    container_name: vendas-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORT: 80
      ConnectionStrings__DefaultConnection: "Host=mssql;Port=5432;Database=GameStore;Username=sa;Password=YourSecurePassword123!"
      Jwt__Key: "your-super-secret-key-that-is-at-least-32-characters-long!"
      Jwt__Issuer: "TheThroneOfGames"
      Jwt__Audience: "TheThroneOfGamesClient"
      EventBus__UseRabbitMq: "true"
      EventBus__RabbitMq__HostName: "rabbitmq"
      EventBus__RabbitMq__Port: "5672"
      EventBus__RabbitMq__UserName: "guest"
      EventBus__RabbitMq__Password: "guest"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "5003:80"
      - "9093:9093"  # Prometheus metrics
    depends_on:
      - mssql
      - rabbitmq
      - jaeger
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thethroneofgames-network


  # Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: thethroneofgames-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    depends_on:
      - usuarios-api
      - catalogo-api
      - vendas-api
    networks:
      - thethroneofgames-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:10.2.0
    container_name: thethroneofgames-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - thethroneofgames-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  thethroneofgames-network:
    driver: bridge

volumes:
  postgresql-data:
    driver: local
  rabbitmq-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local
