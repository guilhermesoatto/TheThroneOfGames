name: CI - The Throne of Games

# CI genérico (build, testes, imagens, segurança) — agnóstico de nuvem. O deploy real na
# AWS EKS (Fase 4) tem workflow dedicado em .github/workflows/deploy-eks.yml, que reusa as
# imagens publicadas pelo job docker-build abaixo.

on:
  push:
    branches: [ master, develop, release/fase-4-kubernetes ]
  pull_request:
    branches: [ master, develop, release/fase-4-kubernetes ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build & Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore TheThroneOfGames.sln

    - name: Build solution
      run: dotnet build TheThroneOfGames.sln --configuration Release --no-restore

    # Category=Integration marca os testes que precisam de infra real (Postgres em
    # localhost:5432, Testcontainers para RabbitMQ/Elasticsearch) — não executam neste job
    # de CI genérico. Ver a suíte completa rodando com infra real em deploy-eks.yml.
    - name: Run unit tests only (excluding integration tests)
      run: dotnet test TheThroneOfGames.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --filter "Category!=Integration"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/*.trx'

  # Job 2: Docker Build & Push (ghcr.io) — imagens de referência para PR/branches genéricas.
  # O deploy-eks.yml builda e publica as mesmas 4 imagens direto no ECR, então este job não
  # é pré-requisito do deploy — mantido para dar visibilidade de build em qualquer branch.
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: usuarios-api
            dockerfile: GameStore.Usuarios.API/Dockerfile
          - name: catalogo-api
            dockerfile: GameStore.Catalogo.API/Dockerfile
          - name: vendas-api
            dockerfile: GameStore.Vendas.API/Dockerfile
          - name: notifications-functions
            dockerfile: GameStore.Notifications.Functions/Dockerfile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.service.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 3: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security (master only)
      uses: github/codeql-action/upload-sarif@v3
      if: always() && github.ref == 'refs/heads/master'
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Upload Trivy results as artifact (all branches)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-security-scan
        path: 'trivy-results.sarif'

  # Job 4: Code Quality Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Analyze with SonarQube
      if: false  # Desabilitado - configure SONAR_TOKEN secret para habilitar
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        dotnet sonarscanner begin \
          /k:"TheThroneOfGames" \
          /n:"The Throne of Games" \
          /d:sonar.host.url="$SONAR_HOST_URL" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
        dotnet build TheThroneOfGames.sln --no-restore
        dotnet test --no-build --verbosity normal \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=opencover
        dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
