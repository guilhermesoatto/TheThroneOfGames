name: CI/CD Pipeline - The Throne of Games (Fase 2 - Monolito)

# Esteira acadêmica da Fase 2 (POSTECH). Cada ação da CI é um job independente:
#   build  -> lint -> test -> integration -> e2e -> package (artefato) -> deploy (CD)
# CD dispara automaticamente após o sucesso da CI (push em master / release/fase-2-monolito).

on:
  push:
    branches: [ master, develop, release/fase-2-monolito ]
  pull_request:
    branches: [ master, develop, release/fase-2-monolito ]
  workflow_dispatch:

env:
  SOLUTION: TheThroneOfGames.sln
  API_PROJECT: TheThroneOfGames.API/TheThroneOfGames.API.csproj
  E2E_PROJECT: TheThroneOfGames.E2E.Tests/TheThroneOfGames.E2E.Tests.csproj
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 3.1 · BUILD — compila a solução e publica o artefato de implantação
  # ─────────────────────────────────────────────────────────────
  build:
    name: 3.1 · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Publish API (artefato de implantação)
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-restore -o ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 3.3 · LINT — dotnet format (formatação/estilo via .editorconfig)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 3.3 · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: dotnet format --verify-no-changes
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes --severity warn --no-restore

  # ─────────────────────────────────────────────────────────────
  # 3.2 · TEST — testes unitários (Domain + Application + Infrastructure/InMemory)
  # ─────────────────────────────────────────────────────────────
  test:
    name: 3.2 · Test (unit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Test (unit — exclui E2E e Integration)
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --filter "FullyQualifiedName!~E2E.Tests&FullyQualifiedName!~Integration.Tests"
          --logger "trx;LogFileName=unit-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults/**/*
          retention-days: 7

      - name: Upload coverage to Codecov (flag=unit)
        uses: codecov/codecov-action@v5
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────
  # 3.4 · INTEGRATION — validação self-contained de integração
  #
  # ESCOPO (decisão do sprint): por ser um monólito, NÃO há slave services
  # disponíveis no CI — SQL Server, Prometheus, Grafana e SMTP ficam FORA
  # desta esteira e são demonstrados manualmente via `docker compose`
  # (ver docs/reports/alinhamento-rubrica-fase2.md).
  # O que este job valida, sem nenhuma dependência externa:
  #   - a aplicação compõe (grafo de DI resolve, Program.cs sobe)
  #   - o modelo EF Core valida
  #   - os endpoints de saúde (/api/usuario/public-info) e de métricas (/metrics) respondem
  # ─────────────────────────────────────────────────────────────
  integration:
    name: 3.4 · Integration (self-contained)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.E2E_PROJECT }}

      - name: Composition / health / metrics
        run: >
          dotnet test ${{ env.E2E_PROJECT }}
          --configuration Release
          --filter "FullyQualifiedName~HealthAndMetricsTests"
          --logger "trx;LogFileName=integration.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: ./TestResults/**/*
          retention-days: 7

      - name: Upload coverage to Codecov (flag=e2e)
        uses: codecov/codecov-action@v5
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────
  # 3.5 · E2E — jornadas HTTP ponta-a-ponta (WebApplicationFactory + EF InMemory)
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: 3.5 · E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.E2E_PROJECT }}

      - name: Run E2E user journeys
        run: >
          dotnet test ${{ env.E2E_PROJECT }}
          --configuration Release
          --filter "FullyQualifiedName~UserJourneyTests"
          --logger "trx;LogFileName=e2e.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload coverage to Codecov (flag=e2e)
        uses: codecov/codecov-action@v5
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ./TestResults/**/*
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # INTEGRATION-DB — testes contra SQL Server REAL (service container).
  # Valida o que o EF InMemory não valida: migrations ponta-a-ponta,
  # dialeto SQL, precisão de coluna, tradução de query.
  # ─────────────────────────────────────────────────────────────
  integration-db:
    name: Integration (SQL Server real)
    runs-on: ubuntu-latest
    needs: build
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_strong_Pass123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Your_strong_Pass123 -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TheThroneOfGames.Integration.Tests/TheThroneOfGames.Integration.Tests.csproj

      - name: Integration tests
        env:
          INTEGRATION_DB_CONNECTION: "Server=localhost,1433;User Id=sa;Password=Your_strong_Pass123;TrustServerCertificate=true;Encrypt=false"
        run: >
          dotnet test TheThroneOfGames.Integration.Tests/TheThroneOfGames.Integration.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=integration-db.trx"
          --results-directory ./TestResults

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-db-results
          path: ./TestResults/**/*
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # SECURITY — SCA bloqueante (dotnet + Trivy fs) + hadolint nos Dockerfiles
  # ─────────────────────────────────────────────────────────────
  security-scan:
    name: Security (SCA + hadolint)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: dotnet — falha em pacote com CVE HIGH/CRITICAL (agent-laws N-08)
        run: |
          set -o pipefail
          dotnet list ${{ env.SOLUTION }} package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -Eiq '\b(High|Critical)\b' vuln.txt; then
            echo "::error::Pacote(s) com vulnerabilidade HIGH/CRITICAL encontrados."
            exit 1
          fi
          echo "OK: nenhum pacote HIGH/CRITICAL."

      - name: hadolint — Dockerfile raiz
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: hadolint — TheThroneOfGames.API/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: TheThroneOfGames.API/Dockerfile
          failure-threshold: error

      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload SARIF to GitHub Security (master only)
        if: always() && github.ref == 'refs/heads/master'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload SARIF artifact (todas as branches)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-scan
          path: 'trivy-results.sarif'
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # CODEQL — SAST no código C# (resultados na aba Security; não bloqueia o deploy)
  # ─────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  # ─────────────────────────────────────────────────────────────
  # PACKAGE — constrói e publica a imagem Docker (Build Artifact) no GHCR
  # Só em push; depende de TODA a CI verde.
  # ─────────────────────────────────────────────────────────────
  package:
    name: Package (Docker → GHCR)
    runs-on: ubuntu-latest
    needs: [ build, lint, test, integration, integration-db, e2e, security-scan ]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.image }}
      sha_tag: ${{ steps.img.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image + tags
        id: img
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}/thethroneofgames-api"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          TAGS="${IMAGE}:${GITHUB_SHA},${IMAGE}:${BRANCH}"
          if [ "${GITHUB_REF_NAME}" = "master" ]; then TAGS="${TAGS},${IMAGE}:latest"; fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (HIGH/CRITICAL — não bloqueante durante a entrega acadêmica)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.sha_tag }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

  # ─────────────────────────────────────────────────────────────
  # DEPLOY (CD) — promove a imagem publicada como "produção".
  # A demonstração de deploy no vídeo é `docker compose pull && up` puxando esta imagem.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: package
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release/fase-2-monolito')
    permissions:
      contents: read
      packages: write
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image → :production
        id: promote
        run: |
          SHA_TAG="${{ needs.package.outputs.sha_tag }}"
          PROD_TAG="${{ needs.package.outputs.image }}:production"
          docker buildx imagetools create --tag "${PROD_TAG}" "${SHA_TAG}"
          echo "prod_tag=${PROD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy summary
        run: |
          {
            echo "### Deploy (CD) — imagem promovida"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Imagem (SHA) | \`${{ needs.package.outputs.sha_tag }}\` |"
            echo "| Tag de produção | \`${{ steps.promote.outputs.prod_tag }}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo ""
            echo "**Executar em produção:**"
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health check (opcional — quando vars.DEPLOY_HEALTH_URL estiver configurada)
        if: vars.DEPLOY_HEALTH_URL != ''
        run: |
          curl --fail --retry 5 --retry-delay 10 "${{ vars.DEPLOY_HEALTH_URL }}/api/usuario/public-info"
