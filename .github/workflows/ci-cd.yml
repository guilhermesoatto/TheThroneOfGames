name: CI/CD Pipeline - The Throne of Games (Fase 2 - Monolito)

on:
  push:
    branches: [ master, develop, release/fase-2-monolito ]
  pull_request:
    branches: [ master, develop, release/fase-2-monolito ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/thethroneofgames-api

jobs:
  # Job 1: Build & Test (CI)
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore TheThroneOfGames.sln

    - name: Build solution
      run: dotnet build TheThroneOfGames.sln --configuration Release --no-restore

    - name: Run tests (Domain, Application, Infrastructure)
      run: dotnet test TheThroneOfGames.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/*.trx'

  # Job 2: Docker Build & Push (CD - Build Artifact)
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build image (no push yet)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        load: true
        tags: thethroneofgames-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Trivy - CVE scan (blocks on HIGH/CRITICAL)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: thethroneofgames-api:${{ github.sha }}
        format: 'table'
        severity: 'HIGH,CRITICAL'
        exit-code: '0' # non-blocking while the academic delivery stabilizes; set to '1' to enforce the gate

    - name: Push image to Container Registry
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 3: Security Scan (filesystem/source)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security (master only)
      uses: github/codeql-action/upload-sarif@v3
      if: always() && github.ref == 'refs/heads/master'
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Upload Trivy results as artifact (all branches)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-security-scan
        path: 'trivy-results.sarif'

  # Job 4: Deploy to Cloud (CD - only runs once cloud secrets are configured)
  deploy-cloud:
    name: Deploy to Cloud Provider
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.CLOUD_DEPLOY_ENABLED == 'true'

    steps:
    - name: Deploy to Cloud Provider
      run: |
        # Placeholder para o comando específico do Cloud Provider escolhido
        # (ex.: az webapp deploy / aws ecs update-service / gcloud run deploy).
        # Ver docs/Objectives/sprint-1/tasks/T05-cloud-deploy.md para os detalhes de cada opção.
        echo "Configure as credenciais do Cloud Provider e o comando de deploy antes de habilitar este job."

    - name: Health Check
      run: |
        curl --fail --retry 5 --retry-delay 10 "${{ secrets.FCG_HEALTH_URL }}/api/usuario/public-info"
