# CI/CD Pipeline — DDD + Hexagonal + K8s Architecture
# Enforces all 7 mandatory gates before allowing deploy to production.
#
# Gates (in order):
#   1. Dependency audit  (npm audit --audit-level=high)
#   2. Type check        (tsc --noEmit)
#   3. Domain lint       (eslint:domain — import whitelist enforcement)
#   4. Tests + Coverage  (node:test unit + integration)
#   5. Image build       (docker build)
#   6. Image scan        (trivy — blocks on HIGH/CRITICAL)
#   7. K8s validation    (kubeconform — offline schema validation, no cluster needed)
#
# This pipeline runs against the suitcase repo's own TypeScript code (MCP RAG server in src/).
# When copying this suitcase into a target project, update SERVICE_PATH and IMAGE_NAME below.

name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ── TypeScript / Node.js gate ──────────────────────────────────────────────
  ci-typescript:
    name: "TypeScript — Audit → Typecheck → Lint → Test → Build → Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Gate 1 — Dependency audit (runs from package-lock.json, no install needed)
      - name: Gate 1 · Dependency audit
        run: npm audit --audit-level=high

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Gate 2 — Type check
      - name: Gate 2 · Type check
        run: npm run typecheck

      # Gate 3 — Domain purity lint
      - name: Gate 3 · Domain purity lint
        run: npm run lint:domain

      # Gate 4 — Unit + integration tests
      - name: Gate 4 · Unit tests
        run: npm run test:unit

      - name: Gate 4 · Integration tests
        run: npm run test:integration

      # Gate 5 — Image build
      - name: Gate 5 · Docker image build
        run: |
          docker build \
            -f docker/typescript/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      # Gate 6 — Image vulnerability scan
      # continue-on-error: this is a suitcase/template repo; the image is illustrative.
      # In a production service repo, remove continue-on-error to enforce hard block.
      - name: Gate 6 · Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

  # ── Gate 7: K8s manifest validation (main branch only) ────────────────────
  # Uses kubeconform — a pure client-side schema validator. No live cluster or
  # KUBECONFIG needed. Downloads CRD schemas from GitHub Kubernetes JSON schema
  # repository. kubectl apply --dry-run=client requires a reachable API server
  # for OpenAPI schema validation even with --validate=false; kubeconform avoids
  # this entirely and is the standard tool for offline k8s manifest CI validation.
  k8s-validate:
    name: "Gate 7 · K8s manifest schema validation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: ci-typescript
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Gate 7 · Validate all K8s manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.0 \
            k8s/namespaces/ \
            k8s/network-policies/ \
            k8s/deployments/ \
            k8s/services/ \
            k8s/hpa/
